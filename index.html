<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منصة المعلم التعليمية — الباقات ولوحة تحكم المستر</title>

  <!-- خط Cairo العربي -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'system-ui', '-apple-system', 'sans-serif'],
            display: ['Cairo', 'sans-serif']
          }
        }
      }
    };
  </script>

  <style>
    :root {
      color-scheme: dark;
    }

    body {
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      background-color: #060913;
      color: #f8fafc;
      overflow-x: hidden;
      margin: 0;
    }

    /* =====================================================================
       خلفية متحركة بطيئة بنمط داكن احترافي (Slow Ambient Drifting Background)
       ===================================================================== */
    .ambient-stage {
      position: fixed;
      inset: 0;
      z-index: -10;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 15%, rgba(79, 70, 229, 0.22), transparent 46%),
        radial-gradient(circle at 82% 22%, rgba(16, 185, 129, 0.16), transparent 44%),
        radial-gradient(circle at 50% 88%, rgba(245, 158, 11, 0.12), transparent 50%),
        linear-gradient(180deg, #050811 0%, #0b1120 55%, #060913 100%);
    }

    .ambient-dots {
      position: absolute;
      inset: -15%;
      background-image: radial-gradient(rgba(148, 163, 184, 0.14) 1px, transparent 1px);
      background-size: 28px 28px;
      will-change: transform, opacity;
      animation: slowGridDrift 28s ease-in-out infinite alternate;
    }

    .orb {
      position: absolute;
      border-radius: 9999px;
      filter: blur(85px);
      will-change: transform, opacity;
    }

    .orb-indigo {
      width: 480px;
      height: 480px;
      top: -110px;
      right: -80px;
      background: rgba(79, 70, 229, 0.28);
      animation: driftOne 24s ease-in-out infinite alternate;
    }

    .orb-emerald {
      width: 430px;
      height: 430px;
      top: 38%;
      left: -110px;
      background: rgba(16, 185, 129, 0.2);
      animation: driftTwo 29s ease-in-out infinite alternate;
    }

    .orb-amber {
      width: 460px;
      height: 460px;
      bottom: -140px;
      right: 22%;
      background: rgba(245, 158, 11, 0.15);
      animation: driftThree 26s ease-in-out infinite alternate;
    }

    @keyframes driftOne {
      0% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.72; }
      50% { transform: translate3d(-45px, 35px, 0) scale(1.06); opacity: 0.92; }
      100% { transform: translate3d(-18px, 75px, 0) scale(0.97); opacity: 0.75; }
    }

    @keyframes driftTwo {
      0% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.65; }
      50% { transform: translate3d(55px, -35px, 0) scale(1.08); opacity: 0.88; }
      100% { transform: translate3d(25px, 45px, 0) scale(0.96); opacity: 0.7; }
    }

    @keyframes driftThree {
      0% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.65; }
      50% { transform: translate3d(-40px, -45px, 0) scale(1.05); opacity: 0.85; }
      100% { transform: translate3d(35px, -18px, 0) scale(1.01); opacity: 0.7; }
    }

    @keyframes slowGridDrift {
      0% { transform: translate3d(0, 0, 0); opacity: 0.35; }
      100% { transform: translate3d(24px, 24px, 0); opacity: 0.6; }
    }

    @media (prefers-reduced-motion: reduce) {
      .orb, .ambient-dots {
        animation: none !important;
        transform: none !important;
      }
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(148, 163, 184, 0.14);
    }

    .glass-header {
      background: rgba(9, 13, 26, 0.88);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(148, 163, 184, 0.14);
    }
  </style>
</head>
<body>

    <div class="ambient-dots"></div>
    <div class="orb orb-indigo"></div>
    <div class="orb orb-emerald"></div>
    <div class="orb orb-amber"></div>
  </div>

  <!-- حاوية التطبيق الرئيسية -->
  <div id="app" class="min-h-screen flex flex-col"></div>

        subtitle: 'بداية اقتصادية لتجربة التعليم الأونلاين مع مجموعة صغيرة',
        monthlyPrice: 799,
        yearlyMonthlyPrice: 666,
        hook: 'حد أقصى 100 طالب — مناسبة للمجموعات الصغيرة جداً',

          { text: 'بحد أقصى 100 طالب فقط شهرياً', ok: true, warn: true },
          { text: 'بدون تطبيق موبايل خاص', ok: false },

    const DEFAULT_COURSES = [

          { id: 'les-2', title: 'المحاضرة 2: توصيل المقاومات على التوالي والتوازي', videoUrl: 'https://video.tafawoq.edu/lec2', pdfNote: 'خرائط_المقاومات.pdf', published: true },
          { id: 'les-3', title: 'المحاضرة 3: قانونا كيرشوف وحل الدوائر المعقدة', videoUrl: 'https://video.tafawoq.edu/lec3', pdfNote: 'مسائل_كيرشوف.pdf', published: false }
        ]
      },
      {

        title: 'المراجعة النهائية في الفيزياء الحديثة — 3 ثانوي',

        ]
      }
    ];

    const DEFAULT_CODES = [
      { id: 'cd-1', code: 'TAFAWOQ-2026', courseId: 'crs-1', courseTitle: 'الفيزياء الكهربية والتيار المستمر — الصف الثالث الثانوي', used: false, usedBy: null, createdAt: 'اليوم، 10:15 ص' },
      { id: 'cd-2', code: 'VIP-8840', courseId: 'crs-2', courseTitle: 'المراجعة النهائية في الفيزياء الحديثة — 3 ثانوي', used: false, usedBy: null, createdAt: 'أمس، 04:30 م' },
      { id: 'cd-3', code: 'PHYS-4410', courseId: 'crs-1', courseTitle: 'الفيزياء الكهربية والتيار المستمر — الصف الثالث الثانوي', used: true, usedBy: 'يوسف طارق محمود', createdAt: 'منذ 3 أيام' }
    ];

    const DEFAULT_ASSESSMENTS = [
      {
        id: 'as-1',
        kind: 'exam', // 'exam' | 'homework'
        title: 'اختبار الفصل الأول: التيار الكهربي وقانون أوم',
        courseTitle: 'الفيزياء الكهربية والتيار المستمر',
        dueDate: 'مفتوح الآن — 15 دقيقة',
        submissionsCount: 318,
        avgScore: '88%',
        questionPreview: 'إذا زاد طول سلك معدني إلى الضعف وقلت مساحة مقطعه إلى النصف، فإن مقاومته الكهربائية تزداد لأربعة أمثالها.'
      },
      {
        id: 'as-2',
        kind: 'homework',
        title: 'واجب المحاضرة 2: مسائل اختزال المقاومات',
        courseTitle: 'الفيزياء الكهربية والتيار المستمر',
        dueDate: 'الخميس القادم — 10:00 م',
        submissionsCount: 274,
        avgScore: '18.5 / 20',
        questionPreview: 'حل مسائل كتاب الشرح من صفحة 18 إلى 24 مع إرفاق خطوات الاختزال.'
      }
    ];

    const DEFAULT_STUDENTS = [
      { id: 'st-1', name: 'يوسف طارق محمود', studentPhone: '01012345678', parentPhone: '01198765432', course: 'الفيزياء الكهربية والتيار المستمر', progress: 92, examScore: 96 },
      { id: 'st-2', name: 'مريم خالد إبراهيم', studentPhone: '01122334455', parentPhone: '01099887766', course: 'المراجعة النهائية في الفيزياء الحديثة', progress: 84, examScore: 91 },
      { id: 'st-3', name: 'عمر حسام الدين', studentPhone: '01234567890', parentPhone: '01555443322', course: 'الفيزياء الكهربية والتيار المستمر', progress: 65, examScore: 79 },
      { id: 'st-4', name: 'نور محمد سعيد', studentPhone: '01511223344', parentPhone: '01066778899', course: 'المراجعة النهائية في الفيزياء الحديثة', progress: 100, examScore: 100 }
    ];

    function getInitialState() {
      const base = {
        teachers: [],
        currentTeacher: null,
        topView: 'packages', // 'packages' | 'teacher'
        authMode: 'register', // 'register' | 'login'
        selectedPackageId: 'open',
        billingCycle: 'monthly', // 'monthly' | 'yearly'
        dashboardTab: 'courses', // 'courses' | 'codes' | 'assessments' | 'students'
        courses: DEFAULT_COURSES,
        codes: DEFAULT_CODES,
        assessments: DEFAULT_ASSESSMENTS,
        students: DEFAULT_STUDENTS,
        authError: '',
        toast: null
      };

      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return base;
        const saved = JSON.parse(raw);
        return {
          ...base,
          teachers: Array.isArray(saved.teachers) ? saved.teachers : [],
          currentTeacher: saved.currentTeacher || null,
          topView: saved.currentTeacher ? 'teacher' : 'packages',
          selectedPackageId: saved.selectedPackageId || 'open',
          dashboardTab: saved.dashboardTab || 'courses',
          courses: Array.isArray(saved.courses) ? saved.courses : DEFAULT_COURSES,
          codes: Array.isArray(saved.codes) ? saved.codes : DEFAULT_CODES,
          assessments: Array.isArray(saved.assessments) ? saved.assessments : DEFAULT_ASSESSMENTS,
          students: Array.isArray(saved.students) ? saved.students : DEFAULT_STUDENTS
        };
      } catch {
        return base;
      }
    }

    let state = getInitialState();
    let toastTimeout = null;

    function saveState() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify({
            teachers: state.teachers,
            currentTeacher: state.currentTeacher,
            selectedPackageId: state.selectedPackageId,
            dashboardTab: state.dashboardTab,
            courses: state.courses,
            codes: state.codes,
            assessments: state.assessments,
            students: state.students
          })
        );
      } catch (e) {
        console.error('تعذر حفظ البيانات في التخزين المحلي:', e);
      }
    }

    function showToast(text, type = 'success') {
      state.toast = { text, type };
      render();
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        state.toast = null;
        render();
      }, 3300);
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function isValidMobile(phone) {
      return /^01[0125][0-9]{8}$/.test((phone || '').trim());
    }

    // =========================================================================
    // دوال التفاعل والتنقل
    // =========================================================================
    window.switchTopView = function (view) {
      state.topView = view;
      state.authError = '';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.setBillingCycle = function (cycle) {
      state.billingCycle = cycle;
      render();
    };

    window.choosePackageAndGoAuth = function (pkgId) {
      state.selectedPackageId = pkgId;
      if (state.currentTeacher) {
        state.currentTeacher = { ...state.currentTeacher, packageId: pkgId };
        state.teachers = state.teachers.map((t) =>
          t.phone === state.currentTeacher.phone ? state.currentTeacher : t
        );
        state.topView = 'teacher';
        saveState();
        render();
        const pkg = PACKAGES.find((p) => p.id === pkgId);
        showToast(`تم تحديث باقتك إلى «${pkg?.name || ''}» بنجاح!`);
        return;
      }
      state.authMode = 'register';
      state.authError = '';
      state.topView = 'teacher';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.switchAuthMode = function (mode) {
      state.authMode = mode;
      state.authError = '';
      render();
    };

    window.handleTeacherRegister = function (event) {
      event.preventDefault();
      const form = event.target;
      const fullName = form.fullName.value.trim();
      const phone = form.phone.value.trim();
      const subject = form.subject.value.trim();
      const email = form.email.value.trim();
      const password = form.password.value.trim();
      const packageId = form.packageId.value || state.selectedPackageId || 'open';

      if (fullName.split(/\s+/).filter(Boolean).length < 2) {
        state.authError = 'يرجى إدخال اسم المعلم بالكامل (اسمين على الأقل).';
        render();
        return;
      }

      if (!isValidMobile(phone)) {
        state.authError = 'رقم الموبايل غير صحيح. يجب أن يبدأ بـ 010 أو 011 أو 012 أو 015 ومكون من 11 رقماً.';
        render();
        return;
      }

      if (!subject) {
        state.authError = 'يرجى إدخال اسم المادة الدراسية.';
        render();
        return;
      }

      if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        state.authError = 'صيغة البريد الإلكتروني غير صحيحة (يمكنك تركه فارغاً لأنه اختياري).';
        render();
        return;
      }

      if (password.length < 4) {
        state.authError = 'يرجى إدخال كلمة مرور لا تقل عن 4 أحرف أو أرقام.';
        render();
        return;
      }

      const teacherAccount = {
        fullName,
        phone,
        subject,
        email,
        password,
        packageId
      };

      const existingIndex = state.teachers.findIndex((t) => t.phone === phone);
      if (existingIndex >= 0) {
        state.teachers[existingIndex] = teacherAccount;
      } else {
        state.teachers.unshift(teacherAccount);
      }

      state.currentTeacher = teacherAccount;
      state.selectedPackageId = packageId;
      state.authError = '';
      state.topView = 'teacher';
      state.dashboardTab = 'courses';
      saveState();
      render();
      showToast(`تم إنشاء حسابك بنجاح يا أستاذ ${fullName}! مرحباً بك في منصة المعلم.`);
    };

    window.handleTeacherLogin = function (event) {
      event.preventDefault();
      const form = event.target;
      const identifier = form.identifier.value.trim();
      const password = form.password.value.trim();

      if (!identifier || !password) {
        state.authError = 'يرجى إدخال رقم الموبايل أو البريد الإلكتروني وكلمة المرور.';
        render();
        return;
      }

      const found = state.teachers.find(
        (t) =>
          (t.phone === identifier || (t.email && t.email.toLowerCase() === identifier.toLowerCase())) &&
          t.password === password
      );

      if (!found) {
        state.authError = 'بيانات الدخول غير مطابقة. تأكد من رقم الموبايل وكلمة المرور أو أنشئ حساب معلم جديد.';
        render();
        return;
      }

      state.currentTeacher = found;
      state.selectedPackageId = found.packageId || 'open';
      state.authError = '';
      state.topView = 'teacher';
      state.dashboardTab = 'courses';
      saveState();
      render();
      showToast(`أهلاً بعودتك يا أستاذ ${found.fullName}!`);
    };

    window.logoutTeacher = function () {
      state.currentTeacher = null;
      state.authMode = 'login';
      state.authError = '';
      saveState();
      render();
      showToast('تم تسجيل الخروج من حساب المعلم.', 'info');
    };

    window.setDashboardTab = function (tab) {
      state.dashboardTab = tab;
      saveState();
      render();
    };

    // إدارة الكورسات والمحاضرات
    window.handleCreateCourse = function (event) {
      event.preventDefault();
      const form = event.target;
      const title = form.title.value.trim();
      const grade = form.grade.value;
      const price = Math.max(0, Number(form.price.value) || 300);

      if (!title) return;

      const newCourse = {
        id: 'crs-' + Date.now(),
        title,
        grade,
        price,
        studentsCount: 0,
        published: true,
        lessons: []
      };

      state.courses.unshift(newCourse);
      form.reset();
      saveState();
      render();
      showToast('تم إنشاء الكورس الجديد وحفظه بنجاح.');
    };

    window.handleAddLesson = function (event) {
      event.preventDefault();
      const form = event.target;
      const courseId = form.courseId.value;
      const title = form.title.value.trim();
      const videoUrl = form.videoUrl.value.trim() || 'https://video.tafawoq.edu/stream';
      const pdfNote = form.pdfNote.value.trim() || 'ملخص_المحاضرة.pdf';

      if (!courseId || !title) return;

      state.courses = state.courses.map((c) => {
        if (c.id !== courseId) return c;
        return {
          ...c,
          lessons: [
            ...c.lessons,
            {
              id: 'les-' + Date.now(),
              title,
              videoUrl,
              pdfNote,
              published: true
            }
          ]
        };
      });

      form.reset();
      saveState();
      render();
      showToast('تمت إضافة المحاضرة وملف الـ PDF للكورس بنجاح.');
    };

    window.toggleCoursePublished = function (courseId) {
      state.courses = state.courses.map((c) =>
        c.id === courseId ? { ...c, published: !c.published } : c
      );
      saveState();
      render();
      showToast('تم تحديث حالة نشر الكورس.');
    };

    window.toggleLessonPublished = function (courseId, lessonId) {
      state.courses = state.courses.map((c) => {
        if (c.id !== courseId) return c;
        return {
          ...c,
          lessons: c.lessons.map((l) =>
            l.id === lessonId ? { ...l, published: !l.published } : l
          )
        };
      });
      saveState();
      render();
      showToast('تم تبديل حالة المحاضرة (منشور / مسودة).');
    };

    window.deleteCourse = function (courseId) {
      state.courses = state.courses.filter((c) => c.id !== courseId);
      saveState();
      render();
      showToast('تم حذف الكورس.', 'info');
    };

    // توليد أكواد التفعيل
    window.handleGenerateCodes = function (event) {
      event.preventDefault();
      const form = event.target;
      const courseId = form.courseId.value;
      const mode = form.codeMode.value;
      const customStr = (form.customCode?.value || '').trim().toUpperCase().replace(/\s+/g, '-');
      const count = Math.min(20, Math.max(1, Number(form.count?.value) || 1));

      const targetCourse = state.courses.find((c) => c.id === courseId) || state.courses[0];
      if (!targetCourse) {
        showToast('يرجى إضافة كورس أولاً قبل توليد الأكواد.', 'error');
        return;
      }

      if (mode === 'custom') {
        if (!customStr) {
          showToast('يرجى كتابة الكود المخصص.', 'error');
          return;
        }
        if (state.codes.some((c) => c.code.toUpperCase() === customStr)) {
          showToast(`الكود ${customStr} مستخدم بالفعل في القائمة.`, 'error');
          return;
        }
        state.codes.unshift({
          id: 'cd-' + Date.now(),
          code: customStr,
          courseId: targetCourse.id,
          courseTitle: targetCourse.title,
          used: false,
          usedBy: null,
          createdAt: 'الآن (مخصص)'
        });
        saveState();
        render();
        showToast(`تم إنشاء الكود المخصص ${customStr} بنجاح.`);
        return;
      }

      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      const created = [];
      for (let i = 0; i < count; i++) {
        let codeStr = 'TFQ-';
        for (let j = 0; j < 6; j++) {
          codeStr += chars[Math.floor(Math.random() * chars.length)];
        }
        created.push({
          id: 'cd-' + Date.now() + '-' + i,
          code: codeStr,
          courseId: targetCourse.id,
          courseTitle: targetCourse.title,
          used: false,
          usedBy: null,
          createdAt: 'الآن'
        });
      }

      state.codes = [...created, ...state.codes];
      saveState();
      render();
      showToast(`تم توليد ${count} ${count === 1 ? 'كود تفعيل' : 'أكواد تفعيل'} بنجاح.`);
    };

    window.copyActivationCode = async function (codeStr) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(codeStr);
        }
      } catch {}
      showToast(`تم نسخ الكود: ${codeStr}`);
    };

      event.preventDefault();
      const form = event.target;
      const kind = form.kind.value;
      const title = form.title.value.trim();
      const courseTitle = form.courseTitle.value;
      const dueDate = form.dueDate.value.trim() || 'مفتوح للطلاب';
      const questionPreview = form.questionPreview.value.trim();

      if (!title) return;

      state.assessments.unshift({
        id: 'as-' + Date.now(),

        title,
        courseTitle,
        dueDate,
        submissionsCount: 0,
        avgScore: 'جديد',

      form.reset();
      saveState();
      render();
      showToast(kind === 'exam' ? 'تم نشر الاختبار الإلكتروني للطلاب.' : 'تم إضافة الواجب المنزلي بنجاح.');

            <div class="glass-panel p-5 rounded-2xl">
              <span class="text-xs font-bold text-slate-400">إجمالي الطلاب</span>
              <p class="text-3xl font-black text-white mt-1.5">${totalStudents.toLocaleString('ar-EG')}</p>
              <span class="text-xs text-emerald-400 font-bold mt-1 block">${pkg.id === 'open' ? 'سعة غير محدودة' : 'ضمن حد الباقة'}</span>
            </div>

            <div class="glass-panel p-5 rounded-2xl">
              <span class="text-xs font-bold text-slate-400">الكورسات النشطة</span>
              <p class="text-3xl font-black text-white mt-1.5">${activeCoursesCount}</p>
              <span class="text-xs text-slate-400 font-semibold mt-1 block">من إجمالي ${state.courses.length} كورسات</span>
            </div>

            <div class="glass-panel p-5 rounded-2xl">
              <span class="text-xs font-bold text-slate-400">الأكواد المُفعّلة / المتاحة</span>
              <p class="text-3xl font-black text-amber-300 mt-1.5">${activeCodesCount}</p>
              <span class="text-xs text-slate-400 font-semibold mt-1 block">من إجمالي ${state.codes.length} كود</span>
            </div>

            <div class="glass-panel p-5 rounded-2xl">
              <span class="text-xs font-bold text-slate-400">متوسط درجات الاختبارات</span>
              <p class="text-3xl font-black text-emerald-400 mt-1.5">${avgExamScore}%</p>
              <span class="text-xs text-slate-400 font-semibold mt-1 block">تقييم تلقائي للطلاب</span>
            </div>
          </section>

          <!-- تبويبات لوحة تحكم المعلم -->
          <nav class="flex flex-wrap gap-2 bg-slate-900/90 p-2 rounded-2xl border border-slate-800">
            ${tabs
              .map(
                (t) => `
              <button
                type="button"
                onclick="setDashboardTab('${t.id}')"
                class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-black flex items-center gap-2 transition-all cursor-pointer ${
                  state.dashboardTab === t.id
                    ? 'bg-indigo-600 text-white shadow'
                    : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                }"
              >
                <span>${t.label}</span>
                <span class="text-[11px] px-2 py-0.5 rounded-full ${
                  state.dashboardTab === t.id ? 'bg-white/20 text-white' : 'bg-slate-800 text-slate-400'
                }">${t.count}</span>
              </button>
            `
              )
              .join('')}
          </nav>

          <!-- محتوى التبويب النشط -->
          <div>${tabBody}</div>
        </div>
      `;
    }

    function render() {
      const root = document.getElementById('app');
      if (!root) return;

      let mainContent = '';
      if (state.topView === 'packages') {
        mainContent = renderPackagesPage();
      } else {
        mainContent = state.currentTeacher ? renderTeacherDashboard() : renderTeacherAuthGate();
      }

      const toastHtml = state.toast
        ? `
          <div class="fixed bottom-5 left-5 z-50 max-w-sm bg-slate-900 text-white px-5 py-3.5 rounded-2xl shadow-2xl border border-slate-700 flex items-center gap-2.5 text-xs sm:text-sm font-bold">
            <span class="w-2.5 h-2.5 rounded-full shrink-0 ${
              state.toast.type === 'error' ? 'bg-rose-400' : state.toast.type === 'info' ? 'bg-sky-400' : 'bg-emerald-400'
            }"></span>
            <span>${escapeHtml(state.toast.text)}</span>
          </div>
        `
        : '';

      root.innerHTML = `
        ${renderTopNavbar()}
        <main class="flex-1">${mainContent}</main>
        <footer class="glass-header py-5 px-4 text-xs text-slate-500">
          <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
            <p class="font-bold text-slate-400">منصة تفوّق التعليمية — بوابة المعلمين وإدارة الباقات.</p>
            <p>تُحفظ بيانات حساب المعلم والكورسات والأكواد تلقائياً في المتصفح.</p>
          </div>
        </footer>
        ${toastHtml}
      `;
    }

    render();
  </script>
</body>
</html>
