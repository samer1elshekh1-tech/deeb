    // =========================================================================
    // أدوات مزامنة التوجيه (Query & Hash) والتخزين المحلي (localStorage)
    // =========================================================================
    function getInitialViewFromUrl() {
      try {
        const params = new URLSearchParams(window.location.search);
        const qView = (params.get('view') || '').toLowerCase();
        const hash = (window.location.hash || '').replace(/^#/, '').toLowerCase();

        if (qView === 'student' || hash.startsWith('student')) return 'student';
        if (qView === 'teacher' || hash.startsWith('teacher')) return 'teacher';
        if (qView === 'pricing' || hash.startsWith('pricing')) return 'pricing';
        return 'pricing';
      } catch {
        return 'pricing';
      }
    }

    function encodeSnapshot(data) {
      try {
        const json = JSON.stringify(data);
        const bytes = new TextEncoder().encode(json);
        let bin = '';
        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        const b64 = btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        return b64.length <= 14000 ? b64 : '';
      } catch {
        return '';
      }
    }

    function decodeSnapshotFromHash() {
      try {
        const h = window.location.hash || '';
        const match = h.match(/data=([A-Za-z0-9\-_]+)/);
        if (!match || !match[1]) return null;
        let b64 = match[1].replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) b64 += '=';
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const json = new TextDecoder().decode(bytes);
        return JSON.parse(json);
      } catch {
        return null;
      }
    }

    function loadInitialData() {
      const fromHash = decodeSnapshotFromHash();
      if (fromHash && Array.isArray(fromHash.courses) && Array.isArray(fromHash.codes)) {
        return {
          courses: fromHash.courses,
          codes: fromHash.codes,
          students: Array.isArray(fromHash.students) ? fromHash.students : DEFAULT_STUDENTS
        };
      }

      try {
        const raw = window.localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.courses) && Array.isArray(parsed.codes)) {
            return {
              courses: parsed.courses,
              codes: parsed.codes,
              students: Array.isArray(parsed.students) ? parsed.students : DEFAULT_STUDENTS
            };
          }
        }
      } catch (e) {
        console.error('خطأ في قراءة localStorage:', e);
      }

      return {
        courses: DEFAULT_COURSES,
        codes: DEFAULT_CODES,
        students: DEFAULT_STUDENTS
      };
    }

    // =========================================================================
    // المكون الرئيسي للتطبيق
    // =========================================================================
    function App() {
      const initialData = useMemo(() => loadInitialData(), []);
      const [activeView, setActiveView] = useState(() => getInitialViewFromUrl());
      const [courses, setCourses] = useState(initialData.courses);
      const [codes, setCodes] = useState(initialData.codes);
      const [students, setStudents] = useState(initialData.students);
      const [showGhGuide, setShowGhGuide] = useState(false);
      const [toast, setToast] = useState(null);

      const showToast = useCallback((text, type = 'success') => {
        setToast({ text, type });
        setTimeout(() => setToast(null), 3200);
      }, []);

      // حفظ في localStorage ومزامنة query + hash
      useEffect(() => {
        const snapshot = { courses, codes, students };
        try {
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
        } catch (e) {
          console.error('تعذر الحفظ في localStorage:', e);
        }

        try {
          const encoded = encodeSnapshot(snapshot);
          const nextHash = encoded ? `${activeView}&data=${encoded}` : activeView;
          const nextUrl = `?view=${activeView}#${nextHash}`;
          if (window.location.search + window.location.hash !== nextUrl) {
            window.history.replaceState(null, '', nextUrl);
          }
        } catch {
          // تجاهل قيود بعض بيئات المعاينة
        }
      }, [courses, codes, students, activeView]);

      // الاستماع لتغير الهاش أو التخزين من تبويب آخر
      useEffect(() => {
        const onHashOrPop = () => {
          setActiveView(getInitialViewFromUrl());
          const decoded = decodeSnapshotFromHash();
          if (decoded && Array.isArray(decoded.courses)) setCourses(decoded.courses);
          if (decoded && Array.isArray(decoded.codes)) setCodes(decoded.codes);
        };

        const onStorage = (e) => {
          if (e.key === STORAGE_KEY && e.newValue) {
            try {
              const parsed = JSON.parse(e.newValue);
              if (Array.isArray(parsed.courses)) setCourses(parsed.courses);
              if (Array.isArray(parsed.codes)) setCodes(parsed.codes);
              if (Array.isArray(parsed.students)) setStudents(parsed.students);
            } catch {}
          }
        };

        window.addEventListener('hashchange', onHashOrPop);
        window.addEventListener('popstate', onHashOrPop);
        window.addEventListener('storage', onStorage);
        return () => {
          window.removeEventListener('hashchange', onHashOrPop);
          window.removeEventListener('popstate', onHashOrPop);
          window.removeEventListener('storage', onStorage);
        };
      }, []);

      const navigateToView = (viewName) => {
        setActiveView(viewName);
        try {
          const snapshot = { courses, codes, students };
          const encoded = encodeSnapshot(snapshot);
          const nextHash = encoded ? `${viewName}&data=${encoded}` : viewName;
          window.history.pushState(null, '', `?view=${viewName}#${nextHash}`);
        } catch {
          window.location.hash = `#${viewName}`;
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const resetDemoData = () => {
        setCourses(DEFAULT_COURSES);
        setCodes(DEFAULT_CODES);
        setStudents(DEFAULT_STUDENTS);
        try {
          window.localStorage.removeItem(STORAGE_KEY);
        } catch {}
        showToast('تمت استعادة البيانات الافتراضية للمنصة.');
      };

      return (

                className="flex items-center gap-3 cursor-pointer"

                </div>

                  <h1 className="text-lg sm:text-xl font-black text-slate-900">منصة تفوّق التعليمية</h1>
                  <p className="text-[11px] text-slate-500 font-semibold">ملف index.html مستقل جاهز لـ GitHub Pages</p>
                </div>
              </div>

              {/* أزرار التنقل بين الواجهات الثلاث + دليل GitHub Pages */}
              <div className="flex flex-wrap items-center justify-center gap-2 w-full lg:w-auto">
                <div className="inline-flex rounded-2xl bg-slate-100 p-1 border border-slate-200">
                  <button

                    onClick={() => navigateToView('pricing')}
                    className={`px-3.5 py-2 rounded-xl text-xs sm:text-sm font-extrabold flex items-center gap-1.5 transition-all cursor-pointer ${
                      activeView === 'pricing'

                        : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    <Icon name="credit" className="w-4 h-4" />

                  </button>

                  <button

                      activeView === 'teacher'
                        ? 'bg-white text-indigo-700 shadow-sm'
                        : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    <Icon name="dashboard" className="w-4 h-4" />
                    <span>منصة المعلم</span>
                  </button>

                  <button
                    type="button"

                    className={`px-3.5 py-2 rounded-xl text-xs sm:text-sm font-extrabold flex items-center gap-1.5 transition-all cursor-pointer ${
                      activeView === 'student'

    // 2) منصة المعلم: إدارة الكورسات والدروس + أكواد التفعيل + متابعة الطلاب
    // =========================================================================
    function TeacherView({ courses, setCourses, codes, setCodes, students, onNavigate, onShowToast }) {
      const [courseTitle, setCourseTitle] = useState('');
      const [courseSubject, setCourseSubject] = useState('الفيزياء');
      const [coursePrice, setCoursePrice] = useState('350');

      const [targetCourseForLesson, setTargetCourseForLesson] = useState(courses[0]?.id || '');
      const [lessonTitle, setLessonTitle] = useState('');
      const [lessonDuration, setLessonDuration] = useState('45:00');

      const [targetCourseForCode, setTargetCourseForCode] = useState(courses[0]?.id || '');
      const [codeType, setCodeType] = useState('random'); // 'random' | 'custom'
      const [customCode, setCustomCode] = useState('TAFAWOQ-2026');
      const [codeCount, setCodeCount] = useState(1);

      const handleAddCourse = (e) => {
        e.preventDefault();
        if (!courseTitle.trim()) return;
        const accents = ['from-indigo-600 to-blue-700', 'from-emerald-600 to-teal-700', 'from-purple-600 to-fuchsia-700', 'from-amber-600 to-orange-700'];
        const newCourse = {
          id: 'course-' + Date.now(),
          title: courseTitle.trim(),
          subject: courseSubject,
          teacher: 'أنت (المعلم)',
          price: Math.max(0, Number(coursePrice) || 300),
          studentsCount: 0,
          published: true,
          enrolled: false,
          accent: accents[courses.length % accents.length],
          description: 'كورس جديد أضيف من لوحة المعلم وجاهز للتفعيل عبر أكواد الشحن.',
          lessons: [],
          quiz: {
            title: 'اختبار تقييمي للكورس',
            questions: [
              {
                id: 'q-auto-' + Date.now(),
                text: 'هل تم تفعيل الكورس بنجاح في منصة الطالب؟',
                options: ['نعم، يعمل بنجاح', 'لا'],
                correctIndex: 0
              }
            ]
          }
        };
        setCourses((prev) => [newCourse, ...prev]);
        setTargetCourseForLesson(newCourse.id);
        setTargetCourseForCode(newCourse.id);
        setCourseTitle('');
        onShowToast('تم إنشاء الكورس الجديد وحفظه.');
      };

      const toggleCoursePublish = (id) => {
        setCourses((prev) => prev.map((c) => (c.id === id ? { ...c, published: !c.published } : c)));
        onShowToast('تم تحديث حالة الكورس (منشور / مسودة).');
      };

      const handleAddLesson = (e) => {
        e.preventDefault();
        if (!lessonTitle.trim() || !targetCourseForLesson) return;
        const newLesson = {
          id: 'les-' + Date.now(),
          title: lessonTitle.trim(),
          duration: lessonDuration.trim() || '40:00',
          published: true,
          completed: false
        };
        setCourses((prev) =>
          prev.map((c) => (c.id === targetCourseForLesson ? { ...c, lessons: [...c.lessons, newLesson] } : c))
        );
        setLessonTitle('');
        onShowToast('تمت إضافة الدرس إلى الكورس.');
      };

      const toggleLessonPublish = (courseId, lessonId) => {
        setCourses((prev) =>
          prev.map((c) => {
            if (c.id !== courseId) return c;
            return {
              ...c,
              lessons: c.lessons.map((l) => (l.id === lessonId ? { ...l, published: !l.published } : l))
            };
          })
        );
        onShowToast('تم تبديل حالة الدرس بين منشور ومسودة.');
      };

      const makeRandomCode = () => {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let r = '';
        for (let i = 0; i < 6; i++) r += chars[Math.floor(Math.random() * chars.length)];
        return `TFQ-${r}`;
      };

      const handleCreateCodes = (e) => {
        e.preventDefault();
        const course = courses.find((c) => c.id === targetCourseForCode) || courses[0];
        if (!course) return;

        if (codeType === 'custom') {
          const clean = customCode.trim().toUpperCase().replace(/\s+/g, '-');
          if (!clean) return;
          if (codes.some((x) => x.code.toUpperCase() === clean)) {
            onShowToast(`الكود ${clean} موجود بالفعل.`, 'error');
            return;
          }
          setCodes((prev) => [
            {
              id: 'code-' + Date.now(),
              code: clean,
              courseId: course.id,
              courseTitle: course.title,
              used: false,
              createdAt: 'الآن (مخصص)'
            },
            ...prev
          ]);
          onShowToast(`تم إنشاء الكود المخصص ${clean} — يمكنك تجربته في منصة الطالب.`);
          return;
        }

        const n = Math.min(15, Math.max(1, Number(codeCount) || 1));
        const batch = [];
        for (let i = 0; i < n; i++) {
          batch.push({
            id: 'code-' + Date.now() + '-' + i,
            code: makeRandomCode(),
            courseId: course.id,
            courseTitle: course.title,
            used: false,
            createdAt: 'الآن'
          });
        }
        setCodes((prev) => [...batch, ...prev]);
        onShowToast(`تم توليد ${n} ${n === 1 ? 'كود تفعيل' : 'أكواد تفعيل'}.`);
      };

      const copyCode = async (codeStr) => {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(codeStr);
          }
        } catch {}
        onShowToast(`تم نسخ الكود: ${codeStr}`);
      };

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 space-y-8">
          {/* رأس منصة المعلم */}
          <div className="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
            <div>
              <span className="text-xs font-extrabold px-3 py-1 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">
                منصة المعلم (?view=teacher / #teacher)
              </span>
              <h2 className="text-2xl sm:text-3xl font-black text-slate-900 mt-2">إدارة الكورسات والأكواد والطلاب</h2>
              <p className="text-xs sm:text-sm text-slate-500 mt-1">
                أي كورس أو درس أو كود تنشئه هنا يُحفظ فوراً ويظهر في منصة الطالب.
              </p>
            </div>
            <button
              type="button"
              onClick={() => onNavigate('student')}
              className="px-5 py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-black shadow-sm cursor-pointer shrink-0"
            >
              الانتقال إلى منصة الطالب ←
            </button>
          </div>

          {/* إنشاء كورس وإضافة درس */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-7">
            <div className="lg:col-span-5 space-y-6">
              <form onSubmit={handleAddCourse} className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                <h3 className="text-lg font-black text-slate-900">إنشاء كورس جديد</h3>
                <div>
                  <label className="block text-xs font-bold text-slate-600 mb-1">عنوان الكورس</label>
                  <input
                    type="text"
                    required
                    value={courseTitle}
                    onChange={(e) => setCourseTitle(e.target.value)}
                    placeholder="مثال: مراجعة ليلة الامتحان - فيزياء"
                    className="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm"
                  />
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">المادة</label>
                    <select
                      value={courseSubject}
                      onChange={(e) => setCourseSubject(e.target.value)}
                      className="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm bg-white"
                    >
                      <option>الفيزياء</option>
                      <option>الرياضيات</option>
                      <option>الكيمياء</option>
                      <option>الأحياء</option>
                      <option>اللغة العربية</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">السعر (ج.م)</label>
                    <input
                      type="number"
                      min="0"
                      value={coursePrice}
                      onChange={(e) => setCoursePrice(e.target.value)}
                      className="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm"
                    />
                  </div>
                </div>
                <button
                  type="submit"
                  className="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-black cursor-pointer"
                >
                  حفظ الكورس الجديد
                </button>
              </form>

              <form onSubmit={handleAddLesson} className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                <h3 className="text-lg font-black text-slate-900">إضافة درس لكورس</h3>
                <div>
                  <label className="block text-xs font-bold text-slate-600 mb-1">اختر الكورس</label>
                  <select
                    value={targetCourseForLesson}
                    onChange={(e) => setTargetCourseForLesson(e.target.value)}
                    className="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm bg-white"
                  >
                    {courses.map((c) => (
                      <option key={c.id} value={c.id}>{c.title}</option>
                    ))}
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-600 mb-1">عنوان الدرس</label>
                  <input
                    type="text"
                    required
                    value={lessonTitle}
                    onChange={(e) => setLessonTitle(e.target.value)}
                    placeholder="مثال: حل تمارين شاملة على الفصل"
                    className="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-600 mb-1">مدة الدرس</label>
                  <input
                    type="text"
                    value={lessonDuration}
                    onChange={(e) => setLessonDuration(e.target.value)}
                    className="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-mono"
                  />
                </div>
                <button
                  type="submit"
                  className="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-black cursor-pointer"
                >
                  إضافة الدرس
                </button>
              </form>
            </div>

            {/* قائمة الكورسات والدروس وحالة منشور/مسودة */}
            <div className="lg:col-span-7 space-y-4">
              {courses.map((course) => (
                <div key={course.id} className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-100">
                    <div>
                      <div className="flex items-center gap-2 mb-1">
                        <span className="text-xs font-bold px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-700">
                          {course.subject}
                        </span>
                        <span
                          className={`text-xs font-extrabold px-2.5 py-0.5 rounded-full ${
                            course.published ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
                          }`}
                        >
                          {course.published ? 'منشور' : 'مسودة'}
                        </span>
                      </div>
                      <h4 className="text-lg font-black text-slate-900">{course.title}</h4>
                      <p className="text-xs text-slate-500 mt-0.5">
                        الطلاب: <strong>{course.studentsCount}</strong> • الدروس: <strong>{course.lessons.length}</strong> • السعر: <strong>{course.price} ج.م</strong>
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={() => toggleCoursePublish(course.id)}
                      className="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-extrabold cursor-pointer self-start sm:self-center"
                    >
                      {course.published ? 'تحويل إلى مسودة' : 'نشر الكورس'}
                    </button>
                  </div>

                  <div className="space-y-2">
                    {course.lessons.map((les, idx) => (
                      <div key={les.id} className="flex items-center justify-between gap-2 p-3 rounded-xl bg-slate-50 text-xs sm:text-sm">
                        <div className="flex items-center gap-2">
                          <span className="font-bold text-slate-400">{idx + 1}.</span>
                          <span className="font-bold text-slate-800">{les.title}</span>
                          <span className="text-slate-400 font-mono text-xs">({les.duration})</span>
                        </div>
                        <button
                          type="button"
                          onClick={() => toggleLessonPublish(course.id, les.id)}
                          className={`px-2.5 py-1 rounded-lg text-xs font-extrabold cursor-pointer ${
                            les.published ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
                          }`}
                        >
                          {les.published ? 'منشور' : 'مسودة'}
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* مولّد أكواد التفعيل (عشوائي أو مخصص) */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-7">
            <form onSubmit={handleCreateCodes} className="lg:col-span-5 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4 h-fit">
              <h3 className="text-lg font-black text-slate-900 flex items-center gap-2">
                <Icon name="key" className="w-5 h-5 text-amber-500" />
                <span>توليد أكواد تفعيل للطلاب</span>
              </h3>

              <div>
                <label className="block text-xs font-bold text-slate-600 mb-1">الكورس المستهدف</label>
                <select
                  value={targetCourseForCode}
                  onChange={(e) => setTargetCourseForCode(e.target.value)}
                  className="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm bg-white"
                >
                  {courses.map((c) => (
                    <option key={c.id} value={c.id}>{c.title}</option>
                  ))}
                </select>
              </div>

              <div className="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl">
                <button
                  type="button"
                  onClick={() => setCodeType('random')}
                  className={`py-2 rounded-lg text-xs font-extrabold cursor-pointer ${
                    codeType === 'random' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600'
                  }`}
                >
                  كود عشوائي
                </button>
                <button
                  type="button"
                  onClick={() => setCodeType('custom')}
                  className={`py-2 rounded-lg text-xs font-extrabold cursor-pointer ${
                    codeType === 'custom' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600'
                  }`}
                >
                  كود مخصص
                </button>
              </div>

              {codeType === 'custom' ? (
                <div>
                  <label className="block text-xs font-bold text-slate-600 mb-1">الكود المخصص</label>
                  <input
                    type="text"
                    required
                    value={customCode}
                    onChange={(e) => setCustomCode(e.target.value)}
                    placeholder="TAFAWOQ-2026"
                    className="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-mono uppercase"
                  />
                </div>
              ) : (
                <div>
                  <label className="block text-xs font-bold text-slate-600 mb-1">عدد الأكواد</label>
                  <select
                    value={codeCount}
                    onChange={(e) => setCodeCount(Number(e.target.value))}
                    className="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm bg-white"
                  >
                    <option value={1}>كود واحد</option>
                    <option value={3}>3 أكواد</option>
                    <option value={5}>5 أكواد</option>
                  </select>
                </div>
              )}

              <button
                type="submit"
                className="w-full py-3 rounded-xl bg-amber-400 hover:bg-amber-500 text-slate-950 text-sm font-black cursor-pointer"
              >
                توليد الأكواد الآن
              </button>
            </form>

            <div className="lg:col-span-7 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-3">
              <h3 className="text-lg font-black text-slate-900 mb-2">أكواد التفعيل ({codes.length})</h3>
              {codes.map((item) => (
                <div
                  key={item.id}
                  className={`p-4 rounded-2xl border flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${
                    item.used ? 'bg-slate-50 border-slate-200 opacity-75' : 'bg-indigo-50/40 border-indigo-200'
                  }`}
                >
                  <div>
                    <div className="flex items-center gap-2">
                      <code className="px-3 py-1 rounded-lg bg-white border border-slate-200 text-sm font-black text-slate-900">
                        {item.code}
                      </code>
                      <span
                        className={`text-xs font-extrabold px-2.5 py-0.5 rounded-full ${
                          item.used ? 'bg-slate-200 text-slate-700' : 'bg-emerald-100 text-emerald-800'
                        }`}
                      >
                        {item.used ? 'مُستخدم' : 'متاح'}
                      </span>
                    </div>
                    <p className="text-xs text-slate-600 mt-1 font-semibold">
                      {item.courseTitle} • <span className="text-slate-400">{item.createdAt}</span>
                    </p>
                  </div>
                  <button
                    type="button"
                    onClick={() => copyCode(item.code)}
                    className="px-3.5 py-2 rounded-xl bg-white hover:bg-slate-50 border border-slate-200 text-xs font-bold text-slate-700 flex items-center gap-1.5 cursor-pointer self-start sm:self-center"
                  >
                    <Icon name="copy" className="w-4 h-4" />
                    <span>نسخ</span>
                  </button>
                </div>
              ))}
            </div>
          </div>

          {/* جدول تقدم الطلاب ودرجات الاختبارات */}
          <div className="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
            <div className="p-6 border-b border-slate-100">
              <h3 className="text-lg font-black text-slate-900">تقدم الطلاب ونتائج الامتحانات</h3>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-right text-xs sm:text-sm">
                <thead className="bg-slate-50 text-slate-500 font-bold">
                  <tr>
                    <th className="py-3.5 px-6">الطالب</th>
                    <th className="py-3.5 px-6">الكورس</th>
                    <th className="py-3.5 px-6">نسبة المشاهدة</th>
                    <th className="py-3.5 px-6">درجة الاختبار</th>
                    <th className="py-3.5 px-6">آخر نشاط</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {students.map((s) => (
                    <tr key={s.id} className="hover:bg-slate-50/70">
                      <td className="py-4 px-6 font-extrabold text-slate-900">{s.name}</td>
                      <td className="py-4 px-6 text-slate-700">{s.course}</td>
                      <td className="py-4 px-6 font-bold text-indigo-700">{s.progress}%</td>
                      <td className="py-4 px-6">
                        <span className="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 font-black text-xs">
                          {s.quizScore}%
                        </span>
                      </td>
                      <td className="py-4 px-6 text-slate-500">{s.lastActive}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 3) منصة الطالب: تفعيل الكورسات بالأكواد + مشاهدة الدروس + اختبارات فورية
    // =========================================================================
    function StudentView({ courses, setCourses, codes, setCodes, students, setStudents, onNavigate, onShowToast }) {
      const [codeInput, setCodeInput] = useState('');
      const [activeCourseId, setActiveCourseId] = useState(courses[0]?.id || '');
      const [activeLessonId, setActiveLessonId] = useState(courses[0]?.lessons[0]?.id || '');
      const [panelMode, setPanelMode] = useState('courses'); // 'courses' | 'watch' | 'quiz'
      const [selectedAnswers, setSelectedAnswers] = useState({});
      const [quizResult, setQuizResult] = useState(null);

      const publishedCourses = courses.filter((c) => c.published);
      const currentCourse = courses.find((c) => c.id === activeCourseId) || publishedCourses[0] || courses[0];
      const visibleLessons = (currentCourse?.lessons || []).filter((l) => l.published);
      const currentLesson = visibleLessons.find((l) => l.id === activeLessonId) || visibleLessons[0];

      const handleActivateCourse = (e) => {
        e.preventDefault();
        const normalized = codeInput.trim().toUpperCase();
        if (!normalized) return;

        const match = codes.find((c) => c.code.toUpperCase() === normalized);
        if (!match) {
          onShowToast('كود التفعيل غير صحيح! جرّب TAFAWOQ-2026 أو أنشئ كوداً من منصة المعلم.', 'error');
          return;
        }
        if (match.used) {
          onShowToast('تم استخدام هذا الكود من قبل.', 'error');
          return;
        }

        setCodes((prev) => prev.map((c) => (c.id === match.id ? { ...c, used: true } : c)));
        setCourses((prev) =>
          prev.map((c) =>
            c.id === match.courseId
              ? { ...c, enrolled: true, published: true, studentsCount: (c.studentsCount || 0) + 1 }
              : c
          )
        );
        setActiveCourseId(match.courseId);
        setCodeInput('');
        onShowToast(`تم تفعيل كورس «${match.courseTitle}» بنجاح!`);
      };

      const toggleLessonDone = (courseId, lessonId) => {
        setCourses((prev) =>
          prev.map((c) => {
            if (c.id !== courseId) return c;
            const updatedLessons = c.lessons.map((l) =>
              l.id === lessonId ? { ...l, completed: !l.completed } : l
            );
            const pub = updatedLessons.filter((l) => l.published);
            const done = pub.filter((l) => l.completed).length;
            const pct = pub.length ? Math.round((done / pub.length) * 100) : 0;

            setStudents((stPrev) =>
              stPrev.map((st, idx) => (idx === 0 ? { ...st, progress: pct, lastActive: 'الآن' } : st))
            );

            return { ...c, lessons: updatedLessons };
          })
        );
      };

      const getProgressPct = (course) => {
        const pub = (course.lessons || []).filter((l) => l.published);
        if (!pub.length) return 0;
        const done = pub.filter((l) => l.completed).length;
        return Math.round((done / pub.length) * 100);
      };

      const submitQuiz = () => {
        const qs = currentCourse?.quiz?.questions || [];
        if (!qs.length) return;
        let correct = 0;
        qs.forEach((q, idx) => {
          if (selectedAnswers[q.id] === q.correctIndex) correct++;
        });
        const pct = Math.round((correct / qs.length) * 100);
        setQuizResult({ correct, total: qs.length, pct });
        setStudents((prev) =>
          prev.map((st, i) => (i === 0 ? { ...st, quizScore: pct, lastActive: 'الآن (اختبار)' } : st))
        );
        onShowToast(`تم تصحيح الاختبار فوراً: ${correct} من ${qs.length} (${pct}%)`);
      };

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 space-y-8">
          {/* تفعيل الكورس بكود الشحن */}
          <div className="bg-gradient-to-l from-emerald-900 via-teal-900 to-slate-900 text-white rounded-3xl p-6 sm:p-8 shadow-lg">
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-center">
              <div className="lg:col-span-7">
                <span className="inline-block text-xs font-extrabold px-3 py-1 rounded-full bg-white/15 text-emerald-200 mb-2">
                  منصة الطالب (?view=student / #student)
                </span>
                <h2 className="text-2xl sm:text-3xl font-black">فعّل كورساتك، شاهد محاضراتك، واختبر نفسك</h2>
                <p className="text-emerald-100/90 text-xs sm:text-sm mt-1">
                  أدخل كود التفعيل التجريبي <code className="bg-black/30 px-2 py-0.5 rounded text-amber-300 font-bold">TAFAWOQ-2026</code> أو أي كود أنشأته في منصة المعلم.
                </p>
              </div>

              <form onSubmit={handleActivateCourse} className="lg:col-span-5 bg-white/10 p-4 rounded-2xl border border-white/15 flex gap-2">
                <input
                  type="text"
                  value={codeInput}
                  onChange={(e) => setCodeInput(e.target.value)}
                  placeholder="أدخل كود التفعيل (مثال: TAFAWOQ-2026)"
                  className="flex-1 px-4 py-2.5 rounded-xl bg-white text-slate-900 text-xs sm:text-sm font-bold focus:outline-none"
                />
                <button
                  type="submit"
                  className="px-5 py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 text-xs sm:text-sm font-black cursor-pointer shrink-0"
                >
                  تفعيل
                </button>
              </form>
            </div>
          </div>

          {/* وضع الكورسات */}
          {panelMode === 'courses' && (
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {publishedCourses.map((course) => {
                const pct = getProgressPct(course);
                return (
                  <div key={course.id} className="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden flex flex-col justify-between">
                    <div>
                      <div className={`h-28 bg-gradient-to-l ${course.accent} p-5 text-white flex items-start justify-between`}>
                        <span className="text-xs font-bold bg-black/25 px-3 py-1 rounded-full">{course.subject}</span>
                        <span
                          className={`text-xs font-black px-3 py-1 rounded-full ${
                            course.enrolled ? 'bg-emerald-400 text-slate-950' : 'bg-white/20 text-white'
                          }`}
                        >
                          {course.enrolled ? 'مفعّل' : 'مقفل (يحتاج كود)'}
                        </span>
                      </div>
                      <div className="p-6">
                        <h3 className="text-lg font-black text-slate-900 mb-2">{course.title}</h3>
                        <p className="text-xs text-slate-500 leading-relaxed mb-4">{course.description}</p>

                        {course.enrolled && (
                          <div>
                            <div className="flex justify-between text-xs font-extrabold mb-1">
                              <span className="text-slate-600">نسبة التقدم</span>
                              <span className="text-indigo-600">{pct}%</span>
                            </div>
                            <div className="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                              <div className="h-full bg-indigo-600 rounded-full" style={{ width: `${pct}%` }} />
                            </div>
                          </div>
                        )}
                      </div>
                    </div>

                    <div className="p-6 pt-0">
                      {course.enrolled ? (
                        <div className="grid grid-cols-2 gap-2">
                          <button
                            type="button"
                            onClick={() => {
                              setActiveCourseId(course.id);
                              const firstPub = course.lessons.find((l) => l.published);
                              setActiveLessonId(firstPub?.id || '');
                              setPanelMode('watch');
                            }}
                            className="py-2.5 px-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-black cursor-pointer"
                          >
                            مشاهدة الدروس
                          </button>
                          <button
                            type="button"
                            onClick={() => {
                              setActiveCourseId(course.id);
                              setSelectedAnswers({});
                              setQuizResult(null);
                              setPanelMode('quiz');
                            }}
                            className="py-2.5 px-3 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200 text-xs font-black cursor-pointer"
                          >
                            بدء الاختبار
                          </button>
                        </div>
                      ) : (
                        <button
                          type="button"
                          onClick={() =>
                            onShowToast(`أدخل كود التفعيل الخاص بكورس «${course.title}» في الخانة بالأعلى لفتحه.`, 'error')
                          }
                          className="w-full py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-black cursor-pointer"
                        >
                          تفعيل الكورس بكود
                        </button>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* وضع مشاهدة الدروس */}
          {panelMode === 'watch' && currentCourse && (
            <div className="space-y-4">
              <button
                type="button"
                onClick={() => setPanelMode('courses')}
                className="text-xs sm:text-sm font-extrabold text-indigo-700 hover:underline cursor-pointer"
              >
                ← العودة إلى الكورسات
              </button>

              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div className="lg:col-span-2 bg-slate-950 text-white rounded-3xl overflow-hidden shadow-xl">
                  <div className="aspect-video bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 flex flex-col items-center justify-center p-6 text-center">
                    <div className="w-16 h-16 rounded-full bg-indigo-600 text-white flex items-center justify-center mb-4 shadow-lg">
                      <Icon name="play" className="w-7 h-7" />
                    </div>
                    <h3 className="text-lg sm:text-2xl font-black">
                      {currentLesson ? currentLesson.title : 'لا توجد دروس منشورة بعد'}
                    </h3>
                    {currentLesson && (
                      <p className="text-xs text-indigo-200 mt-2 font-mono">المدة: {currentLesson.duration}</p>
                    )}
                  </div>

                  {currentLesson && (
                    <div className="p-5 bg-slate-900 flex items-center justify-between gap-4">
                      <span className="text-xs sm:text-sm font-bold">{currentCourse.title}</span>
                      <button
                        type="button"
                        onClick={() => toggleLessonDone(currentCourse.id, currentLesson.id)}
                        className={`px-4 py-2 rounded-xl text-xs font-black cursor-pointer ${
                          currentLesson.completed ? 'bg-emerald-400 text-slate-950' : 'bg-white/15 hover:bg-white/25 text-white'
                        }`}
                      >
                        {currentLesson.completed ? 'مكتمل ✓' : 'تحديد كمكتمل'}
                      </button>
                    </div>
                  )}
                </div>

                <div className="bg-white rounded-3xl border border-slate-200 p-5 shadow-sm space-y-3 h-fit">
                  <h4 className="font-black text-slate-900">دروس الكورس ({visibleLessons.length})</h4>
                  {visibleLessons.map((les, idx) => (
                    <button
                      key={les.id}
                      type="button"
                      onClick={() => setActiveLessonId(les.id)}
                      className={`w-full text-right p-3 rounded-2xl border text-xs sm:text-sm flex items-center justify-between gap-2 cursor-pointer ${
                        les.id === currentLesson?.id ? 'bg-indigo-50 border-indigo-300 font-extrabold' : 'bg-slate-50 border-slate-100'
                      }`}
                    >
                      <span>{idx + 1}. {les.title}</span>
                      {les.completed && <span className="text-emerald-600 font-black">✓</span>}
                    </button>
                  ))}

                  <button
                    type="button"
                    onClick={() => {
                      setSelectedAnswers({});
                      setQuizResult(null);
                      setPanelMode('quiz');
                    }}
                    className="w-full py-3 rounded-xl bg-amber-400 hover:bg-amber-500 text-slate-950 text-xs sm:text-sm font-black cursor-pointer"
                  >
                    الانتقال إلى الاختبار
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* وضع الاختبار التفاعلي والنتيجة الفورية */}
          {panelMode === 'quiz' && currentCourse?.quiz && (
            <div className="max-w-3xl mx-auto space-y-4">
              <button
                type="button"
                onClick={() => setPanelMode('courses')}
                className="text-xs sm:text-sm font-extrabold text-indigo-700 hover:underline cursor-pointer"
              >
                ← العودة إلى الكورسات
              </button>

              <div className="bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 shadow-sm space-y-6">
                <div className="flex items-center justify-between border-b border-slate-100 pb-4">
                  <h3 className="text-xl font-black text-slate-900">{currentCourse.quiz.title}</h3>
                  <Icon name="award" className="w-7 h-7 text-amber-500" />
                </div>

                {quizResult && (
                  <div className="p-5 rounded-2xl bg-slate-900 text-white text-center">
                    <p className="text-2xl font-black text-amber-400">
                      نتيجتك: {quizResult.correct} من {quizResult.total} ({quizResult.pct}%)
                    </p>
                    <p className="text-xs sm:text-sm text-slate-300 mt-1">
                      تم تحديث درجتك في سجل متابعة المعلم تلقائياً.
                    </p>
                  </div>
                )}

                {currentCourse.quiz.questions.map((q, qIdx) => (
                  <div key={q.id} className="p-4 rounded-2xl bg-slate-50 border border-slate-200/80 space-y-3">
                    <p className="font-extrabold text-sm sm:text-base text-slate-900">
                      {qIdx + 1}. {q.text}
                    </p>
                    <div className="space-y-2">
                      {q.options.map((opt, optIdx) => {
                        const chosen = selectedAnswers[q.id] === optIdx;
                        const isRight = quizResult && q.correctIndex === optIdx;
                        const isWrongChosen = quizResult && chosen && q.correctIndex !== optIdx;

                        return (
                          <button
                            key={optIdx}
                            type="button"
                            disabled={Boolean(quizResult)}
                            onClick={() => setSelectedAnswers((prev) => ({ ...prev, [q.id]: optIdx }))}
                            className={`w-full text-right p-3 rounded-xl border text-xs sm:text-sm transition-all cursor-pointer ${
                              isRight
                                ? 'bg-emerald-50 border-emerald-500 text-emerald-900 font-black'
                                : isWrongChosen
                                ? 'bg-rose-50 border-rose-500 text-rose-900 font-bold'
                                : chosen
                                ? 'bg-indigo-50 border-indigo-600 text-indigo-900 font-bold'
                                : 'bg-white border-slate-200 hover:border-indigo-300'
                            }`}
                          >
                            {opt}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                ))}

                <div className="flex justify-end gap-3">
                  {!quizResult ? (
                    <button
                      type="button"
                      onClick={submitQuiz}
                      className="px-7 py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-black cursor-pointer"
                    >
                      تسليم الاختبار وعرض النتيجة
                    </button>
                  ) : (
                    <button
                      type="button"
                      onClick={() => {
                        setSelectedAnswers({});
                        setQuizResult(null);
                      }}
                      className="px-6 py-3 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white text-sm font-bold cursor-pointer"
                    >
                      إعادة المحاولة
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
